<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NIDS: upload a capture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    .msg { background: #fff3cd; padding: .6rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    button { padding: .5rem 1.2rem; }
  </style>
</head>
<body>
  <h1>Network Intrusion Detector</h1>
  <p>Upload a packet capture (.pcap or .pcapng, up to 50 MB) to analyze it.</p>

  {% for m in get_flashed_messages() %}
    <div class="msg">{{ m }}</div>
  {% endfor %}

  <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".pcap,.pcapng">
    <button type="submit">Analyze</button>
  </form>
</body>
</html>
